name: Statistical validation question
description: Ask about the standalone Python model, diagnostics, or evidence contract.
title: "[Validation]: "
labels: ["validation"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include confidential rating data. Include the Python app version, AnalysisID, model, method, settings, ReasonCodes, and the smallest synthetic example that reproduces the issue.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - JMLE estimation
        - MML estimation / population scale
        - GPCM / EAP / plausible values
        - Evidence / sensitivity contract
        - Anchor / linking / equating
        - Bias / local interaction
        - Prediction / simulation / design evaluation
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe the Python-app behavior, expected contract, and observed evidence.
    validations:
      required: true
  - type: textarea
    id: reproducible
    attributes:
      label: Reproducible setup
      description: Use built-in or simulated data and include the exact settings. Do not paste private data.
      render: text
    validations:
      required: false
  - type: textarea
    id: package_versions
    attributes:
      label: Python environment
      description: Include the output of `python streamlit_app.py --doctor`.
      render: text
    validations:
      required: false
