name: Windows desktop

on:
  push:
    branches: [main, master, slope-aware-bias-inference, 'desktop/**']
    paths:
      - 'desktop_app.py'
      - 'mfrm_app/**'
      - 'streamlit_app.py'
      - 'validation/operating_characteristics_facets.py'
      - 'tests/**'
      - 'locales/**'
      - 'examples/desktop_writing.csv'
      - 'scripts/build_desktop.py'
      - 'scripts/check_windows_desktop.py'
      - 'scripts/desktop.spec'
      - 'scripts/runtime_notices/**'
      - 'requirements*.txt'
      - 'CITATION.cff'
      - 'LICENSE*'
      - 'docs/desktop_windows_installation.md'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - "desktop_app.py"
      - "streamlit_app.py"
      - "mfrm_app/**"
      - "validation/operating_characteristics_facets.py"
      - "examples/desktop_writing.csv"
      - "locales/**"
      - "requirements*.txt"
      - "tests/**"
      - "scripts/**"
      - "docs/desktop_windows_installation.md"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-runtime:
    # Candidate pushes build once; their pull request runs source checks once.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/desktop/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify spawn lifecycle, projects, figures and interpretation holds
        run: >-
          python -m pytest -q -W error
          tests/test_desktop_worker.py tests/test_desktop_project.py tests/test_desktop_ux.py
          tests/test_desktop_workflows.py tests/test_desktop_outputs.py
          tests/test_desktop_packaging.py
          tests/test_person_boundary_output.py tests/test_measure_report_consistency.py
          tests/test_report_run_facts.py
          tests/test_scorefile_row_alignment.py
          tests/test_apptest_process_isolation.py
          tests/test_operating_characteristics_facets_adapter.py tests/test_facets_visible_launcher.py
      - name: Verify tracked source stayed clean
        run: git diff --exit-code

  windows-desktop:
    if: github.event_name != 'pull_request'
    # This is the build host, not Windows 11 GUI acceptance.
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.3'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-desktop-build.txt
      - name: Install isolated build dependencies
        run: |
          python -m venv "${{ runner.temp }}/mfrm-build-env"
          & "${{ runner.temp }}/mfrm-build-env/Scripts/python.exe" -m pip install --only-binary=:all: -r requirements-desktop-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the windowed application
        run: |
          & "${{ runner.temp }}/mfrm-build-env/Scripts/python.exe" scripts/build_desktop.py --output "${{ runner.temp }}/mfrm-windows-build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check frozen workflows, restore and package
        run: |
          python scripts/check_windows_desktop.py --build-dir "${{ runner.temp }}/mfrm-windows-build" --output "${{ runner.temp }}/mfrm-windows-checks"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain verification records even after failure
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: windows-desktop-checks-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mfrm-windows-build/desktop_build.json
            ${{ runner.temp }}/mfrm-windows-build/work/desktop/warn-desktop.txt
            ${{ runner.temp }}/mfrm-windows-checks
          if-no-files-found: warn
          retention-days: 14
      - name: Retain candidate for Windows 11 acceptance
        uses: actions/upload-artifact@v6.0.0
        with:
          name: windows-desktop-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mfrm-windows-build/MFRM-Desktop-Windows-x64.zip
            ${{ runner.temp }}/mfrm-windows-build/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
