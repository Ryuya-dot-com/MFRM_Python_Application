name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - "README.ja.md"
      - "docs/desktop_user_guide.en.md"
      - "docs/desktop_user_guide.ja.md"
      - "docs/analysis_scope.md"
      - "docs/apa_manuscript_template.md"
      - "docs/images/**"
      - "examples/desktop_writing.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build and verify static site
        run: python site/build_site.py --output /tmp/mfrm-pages-dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/mfrm-pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
