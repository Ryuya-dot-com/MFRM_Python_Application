name: Python package

on:
  push:
    branches: [main, master]
    paths: &package_paths
      - "pyproject.toml"
      - "mfrmpy/**"
      - "mfrm_app/**"
      - "locales/en.json"
      - "examples/desktop_writing.csv"
      - "docs/python_library.md"
      - "docs/analysis_scope.md"
      - "CHANGELOG.md"
      - "tests/test_python_library.py"
      - "LICENSE*"
      - ".github/workflows/python-package.yml"
  pull_request:
    paths: *package_paths
  workflow_dispatch:
    inputs:
      target:
        description: "Validate only, or explicitly publish the tested distributions"
        required: true
        default: none
        type: choice
        options: [none, testpypi, pypi]
      validated_run_id:
        description: "Optional successful main push run at this commit whose tested distributions should be published"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'none' || inputs.validated_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Build wheel from source distribution and check metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
        minimum: [false]
        include:
          - os: ubuntu-latest
            python: "3.11"
            minimum: true
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-dist
          path: dist
      - name: Install declared minimum core dependencies
        if: matrix.minimum
        run: python -m pip install "numpy==1.26.0" "pandas==3.0.0" "scipy==1.10.0" "pyarrow==16.0.0"
      - name: Test installed core away from the source tree
        run: |
          python -m pip install dist/*.whl "pytest>=8"
          python -m pip check
          cp pyproject.toml tests/test_python_library.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -I -m pytest test_python_library.py -q
      - name: Install optional plotting dependency
        if: ${{ !matrix.minimum }}
        run: python -m pip install "matplotlib>=3.8"
      - name: Install minimum optional plotting dependency
        if: matrix.minimum
        run: python -m pip install "numpy==1.26.0" "pandas==3.0.0" "scipy==1.10.0" "pyarrow==16.0.0" "matplotlib==3.8.0"
      - name: Test figures and HTML from the installed package
        run: |
          cd "$RUNNER_TEMP"
          python -I -m pytest test_python_library.py -q -m figures

  publish:
    if: >-
      always() && !cancelled() && github.event_name == 'workflow_dispatch' &&
      inputs.target != 'none' && github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' || (inputs.validated_run_id != '' && needs.build.result == 'skipped'))
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Verify reused distributions came from the successful package workflow at this commit
        if: inputs.validated_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.validated_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" |
            jq -e --arg sha "$GITHUB_SHA" '
              .head_sha == $sha and .head_branch == "main" and .event == "push" and
              .path == ".github/workflows/python-package.yml" and .conclusion == "success"
            '
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-dist
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validated_run_id || github.run_id }}
      - name: Publish tested distributions to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish tested distributions to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
