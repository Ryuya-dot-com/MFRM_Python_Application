name: Python Streamlit

on:
  push:
    branches: [main, master]
    paths:
      - "streamlit_app.py"
      - "requirements.txt"
      - ".github/workflows/python-streamlit.yml"
      - "tests/**"
      - "validation/**"
  pull_request:
    branches: [main, master]
    paths:
      - "streamlit_app.py"
      - "requirements.txt"
      - ".github/workflows/python-streamlit.yml"
      - "tests/**"
      - "validation/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile app
        run: python -m py_compile streamlit_app.py

      - name: Run environment doctor
        run: python streamlit_app.py --doctor

      - name: Run engine self-tests
        run: python streamlit_app.py --self-test

      - name: Run Streamlit AppTest smoke
        run: pytest tests/test_app_smoke.py

      - name: Run benchmark smoke
        run: python streamlit_app.py --benchmark-quick --benchmark-csv validation/generated/benchmark_smoke.csv

      - name: Export parity fixture smoke
        run: python streamlit_app.py --export-parity-fixture validation/generated/parity_fixture
