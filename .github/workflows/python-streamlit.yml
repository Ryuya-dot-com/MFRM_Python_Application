name: Python Streamlit - remaining release checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remaining-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2
      - name: Confirm application and tests match the candidate parent
        run: git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/python-streamlit.yml'
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Complete Web and desktop archive interoperability without a wall-clock test limit
        run: python -m pytest -q tests/test_web_desktop_interoperability_and_diagnostics.py::test_bidirectional_mfrm_portability_web_to_desktop_and_desktop_to_web --durations=1
      - name: Run previously unexecuted benchmark smoke
        run: python streamlit_app.py --benchmark-quick --benchmark-csv validation/generated/benchmark_smoke.csv
      - name: Run previously unexecuted demo report export
        run: python streamlit_app.py --export-demo-report validation/generated/demo_report
      - name: Verify tracked checkout stayed clean
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
